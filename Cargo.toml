[package]
name = "mjae"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Micro-Joule Attribution Engine core primitives and OS providers"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
crossbeam-skiplist = "0.1.3"
log = "0.4.27"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.13.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-sys = "0.3.0"
libc = "0.2.177"

[profile.dev]
opt-level = 1
debug = 2

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
